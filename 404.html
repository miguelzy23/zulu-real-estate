<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Página no encontrada | Zulu Real Estate</title>
<meta name="robots" content="noindex" />
<meta name="theme-color" content="#0A0A0A" />
<link rel="icon" href="/favicon.ico?v=3" sizes="any" />
<link rel="icon" href="/favicon-32.png?v=3" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@800&family=Fraunces:ital,opsz,wght@1,9..144,400&family=Inter:wght@400;500;600&display=swap" />
<style>
  :root{ --ink:#0A0A0A; --cream:#FAEEDA; --dim:#c9bda6; --gold:#d8ad6b; }
  *{box-sizing:border-box}
  html,body{height:100%; margin:0}
  body{
    background:var(--ink); color:var(--cream);
    font-family:'Inter',system-ui,sans-serif; font-size:17px; line-height:1.6;
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  main{max-width:520px; width:100%}
  .marca{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:44px; letter-spacing:.04em; line-height:1; margin:0 0 28px; color:#fff}
  h1{font-family:'Fraunces',Georgia,serif; font-style:italic; font-weight:400; font-size:clamp(28px,7vw,40px); line-height:1.2; margin:0 0 14px}
  p{margin:0 0 12px; color:var(--dim)}
  .en{font-size:15px; opacity:.85}
  .botones{display:flex; flex-wrap:wrap; gap:12px; margin:28px 0 22px}
  a.btn{
    display:inline-flex; align-items:center; justify-content:center; min-height:48px; padding:0 26px; border-radius:999px;
    font-weight:600; font-size:15px; text-decoration:none; color:var(--ink); background:var(--cream); border:1px solid var(--cream);
  }
  a.btn.linea{background:transparent; color:var(--cream); border-color:rgba(250,238,218,.35)}
  a.btn:focus-visible{outline:2px solid var(--gold); outline-offset:3px}
  a.texto{color:var(--cream); text-underline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="marca" aria-hidden="true">ZULU</p>
  <h1>Esta página no existe.</h1>
  <p>Puede que el enlace esté mal escrito o que la propiedad ya no esté publicada.</p>
  <div class="botones">
    <a class="btn" href="/">Ir al inicio</a>
    <a class="btn linea" href="/#propiedades">Ver propiedades</a>
  </div>
  <p class="en">Page not found. <a class="texto" href="/en">Go to the English home page</a>.</p>
</main>
</body>
</html>
